# Local stack: the Alianza One MCP server over Streamable HTTP plus the fake
# Alianza API, so the whole thing runs without real credentials.
#
#   docker compose -f deploy/docker-compose.alianza-one.yml up --build
#   curl http://127.0.0.1:3000/healthz
#
# For real Alianza, drop the fake-api service and set ALIANZA_BASE_URL,
# ALIANZA_USERNAME, and ALIANZA_PASSWORD from a secret store.
services:
  fake-api:
    build:
      context: ../alianza-one
    command: ["node", "dist/fake-api.js"]
    environment:
      FAKE_API_PORT: "4010"
    network_mode: "service:mcp"

  mcp:
    build:
      context: ../alianza-one
    ports:
      - "3000:3000"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"
      MCP_ALLOWED_HOSTS: "localhost,127.0.0.1"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-token}
      ALIANZA_BASE_URL: http://127.0.0.1:4010
      ALIANZA_USERNAME: api@example.com
      ALIANZA_PASSWORD: correct-horse
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
