# Local stack: the MCP server over Streamable HTTP plus the fake Items API.
#
#   docker compose -f deploy/docker-compose.yml up --build
#   curl http://127.0.0.1:3000/healthz
#
# Swap `typescript` for `python` in the build context (and port 3000 for 8000)
# to run the Python template instead.
services:
  fake-api:
    build:
      context: ../templates/typescript
    command: ["node", "dist/fake-api.js"]
    environment:
      FAKE_API_PORT: "4010"
    # The fake API binds to 127.0.0.1 inside its container; expose it to the
    # server by sharing the network namespace.
    network_mode: "service:mcp"

  mcp:
    build:
      context: ../templates/typescript
    ports:
      - "3000:3000"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"
      MCP_ALLOWED_HOSTS: "localhost,127.0.0.1"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-dev-token}
      API_BASE_URL: http://127.0.0.1:4010
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
