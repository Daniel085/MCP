[project]
name = "mcp-evals"
version = "0.1.0"
description = "Tool-selection evals: does Claude pick the right MCP tool for a prompt?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.4,<2",
    "mcp~=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "anyio>=4.9", "ruff>=0.12"]

[project.scripts]
mcp-evals = "mcp_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
