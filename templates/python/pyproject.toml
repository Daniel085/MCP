[project]
name = "mcp-server-template"
version = "0.1.0"
description = "MCP server template that wraps an existing HTTP API. Supports stdio and Streamable HTTP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp~=2.2",
    "httpx>=0.28,<1",
    "pydantic>=2.10",
    "starlette>=0.47",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "anyio>=4.9",
    "ruff>=0.12",
]

[project.scripts]
mcp-server = "mcp_server.__main__:main"
fake-api = "mcp_server.fake_api:main"
smoke = "mcp_server.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
